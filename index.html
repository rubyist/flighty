<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flighty</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0e8d8;
            color: #3a2e1e;
            font-family: "Courier New", Courier, monospace;
            padding: 20px;
            min-height: 100vh;
        }

        .airport-header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #c4b99a;
            margin-bottom: 30px;
        }

        .airport-header h1 {
            font-size: 2em;
            color: #8b5a2b;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .airport-header .datetime {
            color: #7a6e5a;
            font-size: 1em;
            margin-top: 8px;
        }

        .last-updated {
            text-align: center;
            color: #9a8e7a;
            font-size: 0.85em;
            margin-bottom: 20px;
        }

        .board {
            max-width: 1000px;
            margin: 0 auto 40px auto;
        }

        .board-header {
            padding: 10px 16px;
            font-size: 1.3em;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #f0e8d8;
            background: #2d4a43;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #e6dcc8;
            color: #6b4226;
            text-align: left;
            padding: 10px 16px;
            font-size: 0.9em;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid #c4b99a;
        }

        td {
            padding: 8px 16px;
            border-bottom: 1px solid #d6cbb2;
            font-size: 1em;
            color: #3a2e1e;
        }

        tr:hover td {
            background: #e6dcc8;
        }

        .no-flights {
            text-align: center;
            padding: 20px;
            color: #9a8e7a;
            font-style: italic;
        }

        .error-msg {
            text-align: center;
            padding: 20px;
            color: #b5432a;
        }

        td a {
            color: #2a7565;
            text-decoration: none;
            border-bottom: 1px dotted #2a7565;
        }

        td a:hover {
            color: #1d5c4f;
            border-bottom-style: solid;
        }

        .status-arrived { color: #4e7a56; }
        .status-enroute { color: #4a6d8a; }
        .status-scheduled { color: #8a7a2e; }

        tr.next-up {
            border-left: 3px solid #8b5a2b;
            background: rgba(139, 90, 43, 0.08);
        }

        tr.next-up td:first-child {
            padding-left: 13px;
        }
    </style>
</head>
<body>
    <div class="airport-header">
        <h1 id="airport-title">Loading&hellip;</h1>
    </div>
    <div class="last-updated" id="last-updated"></div>

    <div class="board">
        <div class="board-header" id="board-header">Flights</div>
        <table>
            <thead>
                <tr>
                    <th> </th>
                    <th>Time</th>
                    <th>Flight</th>
                    <th>Airport</th>
                    <th>Aircraft</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="flights-body">
                <tr><td colspan="6" class="no-flights">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const airportCache = {};

        async function lookupAirport(code) {
            if (!code) return null;
            if (code in airportCache) return airportCache[code];
            try {
                const res = await fetch(`/airport?code=${encodeURIComponent(code)}`);
                if (!res.ok) return null;
                const data = await res.json();
                airportCache[code] = { name: data.name || '', url: data.url || '' };
                return airportCache[code];
            } catch {
                return null;
            }
        }

        function formatTime(iso) {
            if (!iso) return '--:--';
            const d = new Date(iso);
            if (isNaN(d)) return '--:--';
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function formatNow() {
            return new Date().toLocaleString([], {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderFlights(flights, tbody) {
            if (!flights || flights.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-flights">No flights</td></tr>';
                return;
            }

            flights.sort((a, b) => {
                if (!a.time) return 1;
                if (!b.time) return -1;
                return new Date(a.time) - new Date(b.time);
            });

            // Find the first flight with a known time at or after now
            const now = Date.now();
            let nextIdx = -1;
            for (let i = 0; i < flights.length; i++) {
                if (flights[i].time && new Date(flights[i].time) >= now) {
                    nextIdx = i;
                    break;
                }
            }

            tbody.innerHTML = flights.map((f, i) => {
                const icon = f.direction === 'dep' ? '🛫' : '🛬';
                const time = formatTime(f.time);
                const identText = escapeHtml(f.ident || '—');
                let identCell = identText;
                if (f.faFlightId) {
                    const encoded = btoa(JSON.stringify(f));
                    identCell = `<a href="/flight?id=${encodeURIComponent(f.faFlightId)}&data=${encodeURIComponent(encoded)}">${identText}</a>`;
                }
                const airportField = f.direction === 'dep' ? 'destination' : 'origin';
                const apt = f[airportField] || {};
                const code = apt.code || '';
                const name = apt.name || '';
                let airportCell = '—';
                if (code) {
                    const svURL = `https://skyvector.com/airport/${code}`;
                    const label = name ? `${escapeHtml(code)} - ${escapeHtml(name)}` : escapeHtml(code);
                    airportCell = `<a href="${svURL}" target="_blank">${label}</a>`;
                }
                const aircraft = escapeHtml(f.registration || f.aircraftType || '');
                const statusText = f.status || '';
                const statusLower = statusText.toLowerCase();
                const statusClass = statusLower.includes('arrived') ? 'status-arrived'
                    : statusLower.includes('en route') ? 'status-enroute'
                    : statusLower.includes('scheduled') ? 'status-scheduled'
                    : '';
                const status = escapeHtml(statusText);
                const cls = i === nextIdx ? ' class="next-up"' : '';
                return `<tr${cls}>
                    <td>${icon}</td>
                    <td>${time}</td>
                    <td>${identCell}</td>
                    <td>${airportCell}</td>
                    <td>${aircraft}</td>
                    <td class="${statusClass}">${status}</td>
                </tr>`;
            }).join('');
        }

        async function refresh() {
            const tbody = document.getElementById('flights-body');

            try {
                const res = await fetch('/flights');
                if (!res.ok) throw new Error('Failed to fetch flights');
                const data = await res.json();

                const deps = (data.departures || []).map(f => ({ ...f, direction: 'dep' }));
                const arrs = (data.arrivals || []).map(f => ({ ...f, direction: 'arr' }));
                renderFlights(deps.concat(arrs), tbody);
            } catch (err) {
                console.error('Refresh error:', err);
                tbody.innerHTML = '<tr><td colspan="6" class="error-msg">Error loading data</td></tr>';
            }

            document.getElementById('last-updated').textContent = 'Last updated: ' + formatNow();
        }


        function updateBoardHeader() {
            const d = new Date();
            const day = d.toLocaleDateString([], { weekday: 'long' });
            const mon = d.toLocaleDateString([], { month: 'short' });
            const date = d.getDate();
            const year = d.getFullYear();
            document.getElementById('board-header').textContent =
                `Flights for ${day} ${mon} ${date}, ${year}`;
        }

        updateBoardHeader();

        // Fetch config, set header, then start refreshing
        (async function init() {
            try {
                const cfgRes = await fetch('/config');
                const cfg = await cfgRes.json();
                const code = cfg.homeAirport || '????';
                const info = await lookupAirport(code);
                const name = info && info.name ? info.name : '';
                const title = name ? `${code} — ${name}` : code;
                document.getElementById('airport-title').textContent = title;
                document.title = title;
            } catch (err) {
                console.error('Config load error:', err);
                document.getElementById('airport-title').textContent = 'Flighty';
            }
            refresh();
            setInterval(refresh, 5 * 60 * 1000);
        })();
    </script>
</body>
</html>
