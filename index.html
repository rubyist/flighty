<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flighty</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow-y: scroll;
        }

        body {
            background: #f0e8d8;
            color: #3a2e1e;
            font-family: "Courier New", Courier, monospace;
            padding: 20px;
            min-height: 100vh;
        }

        .airport-header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #c4b99a;
            margin-bottom: 30px;
        }

        .airport-header h1 {
            font-size: 2em;
            color: #8b5a2b;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .airport-header .datetime {
            color: #7a6e5a;
            font-size: 1em;
            margin-top: 8px;
        }

        .last-updated {
            text-align: center;
            color: #9a8e7a;
            font-size: 0.85em;
            margin-bottom: 20px;
        }

        .board {
            max-width: 1000px;
            margin: 0 auto 40px auto;
        }

        .board-header {
            padding: 10px 16px;
            font-size: 1.3em;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #f0e8d8;
            background: #2d4a43;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #e6dcc8;
            color: #6b4226;
            text-align: left;
            padding: 10px 16px;
            font-size: 0.9em;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid #c4b99a;
        }

        td {
            padding: 8px 16px;
            border-bottom: 1px solid #d6cbb2;
            font-size: 1em;
            color: #3a2e1e;
        }

        tr:hover td {
            background: #e6dcc8;
        }

        .no-flights {
            text-align: center;
            padding: 20px;
            color: #9a8e7a;
            font-style: italic;
        }

        .error-msg {
            text-align: center;
            padding: 20px;
            color: #b5432a;
        }

        td a {
            color: #2a7565;
            text-decoration: none;
            border-bottom: 1px dotted #2a7565;
        }

        td a:hover {
            color: #1d5c4f;
            border-bottom-style: solid;
        }

        .status-arrived { color: #4e7a56; }
        .status-enroute { color: #4a6d8a; }
        .status-scheduled { color: #8a7a2e; }

        .status-cell {
            display: flex;
            justify-content: space-between;
            gap: 1em;
        }

        .status-time {
            white-space: nowrap;
        }

        tr.next-up {
            border-top: 3px solid #8a7a2e;
        }

        tr.overhead {
            border-left: 3px solid #a45a52;
        }

        tr.overhead td:first-child {
            padding-left: 12px;
        }

        tr.arrived-divider {
            cursor: pointer;
            user-select: none;
        }

        tr.arrived-divider td {
            background: #e6dcc8;
            color: #6b4226;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        tr.arrived-divider:hover td {
            background: #ddd0b8;
        }

        tr.arrived-hidden {
            display: none;
        }

        .time-actual    { color: #4e7a56; }
        .time-estimated { color: #4a6d8a; }
        .time-scheduled { color: #8a7a2e; }

        tr.flight-row { cursor: pointer; }

        tr.flight-detail > td {
            padding: 0;
            border-bottom: 1px solid #d6cbb2;
        }

        tr.flight-detail:hover > td {
            background: inherit;
        }

        .detail-content {
            display: flex;
            gap: 20px;
            padding: 12px 16px;
            background: #e9e1cf;
        }

        .detail-content .info-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 4px 12px;
            font-size: 0.85em;
        }

        .detail-content .info-label {
            color: #6b4226;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85em;
        }

        .detail-content .info-value {
            color: #3a2e1e;
        }

        .detail-content .info-value a {
            color: #2a7565;
            text-decoration: none;
            border-bottom: 1px dotted #2a7565;
        }

        .detail-content .info-value a:hover {
            color: #1d5c4f;
            border-bottom-style: solid;
        }

        .detail-content .map-container {
            flex: 0 0 300px;
            text-align: center;
        }

        .detail-content .map-container img {
            max-width: 100%;
            border: 1px solid #c4b99a;
        }

        .detail-content .map-loading,
        .detail-content .map-error {
            color: #9a8e7a;
            font-style: italic;
            padding: 20px;
            font-size: 0.85em;
        }

        .detail-content .map-error {
            color: #b5432a;
        }

        @media (max-width: 700px) {
            .detail-content {
                flex-direction: column;
            }
            .detail-content .map-container {
                flex: none;
            }
        }
    </style>
</head>
<body>
    <div class="airport-header">
        <h1 id="airport-title">Loading&hellip;</h1>
    </div>
    <div class="last-updated" id="last-updated"></div>

    <div class="board">
        <div class="board-header" id="board-header">Flights</div>
        <table>
            <thead>
                <tr>
                    <th> </th>
                    <th>Time</th>
                    <th>Flight</th>
                    <th>Airport</th>
                    <th>Aircraft</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="flights-body">
                <tr><td colspan="6" class="no-flights">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const airportCache = {};

        async function lookupAirport(code) {
            if (!code) return null;
            if (code in airportCache) return airportCache[code];
            try {
                const res = await fetch(`/airport?code=${encodeURIComponent(code)}`);
                if (!res.ok) return null;
                const data = await res.json();
                airportCache[code] = { name: data.name || '', url: data.url || '' };
                return airportCache[code];
            } catch {
                return null;
            }
        }

        function formatTime(iso) {
            if (!iso) return '--:--';
            const d = new Date(iso);
            if (isNaN(d)) return '--:--';
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function formatNow() {
            return new Date().toLocaleString([], {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function timeSourceClass(source) {
            if (source === 'A') return 'time-actual';
            if (source === 'E') return 'time-estimated';
            return 'time-scheduled';
        }

        function timeSourceLabel(source) {
            if (source === 'A') return 'Actual';
            if (source === 'E') return 'Estimated';
            return 'Scheduled';
        }

        let arrivedExpanded = false;
        let enrouteExpanded = false;
        let expandedFlights = new Set();
        const mapCache = new Map();

        function renderFlightRow(f, isNextUp, overheadIds, extraClasses) {
            const icon = f.direction === 'dep' ? '🛫' : '🛬';
            const time = formatTime(f.time);
            const identText = escapeHtml(f.ident || '—');
            let identCell = identText;
            const airportField = f.direction === 'dep' ? 'destination' : 'origin';
            const apt = f[airportField] || {};
            const code = apt.code || '';
            const name = apt.name || '';
            let airportCell = '—';
            if (code) {
                const svURL = `https://skyvector.com/airport/${code}`;
                const label = name ? `${escapeHtml(code)} - ${escapeHtml(name)}` : escapeHtml(code);
                airportCell = `<a href="${svURL}" target="_blank">${label}</a>`;
            }
            const aircraft = escapeHtml(f.registration || f.aircraftType || '');
            const statusText = f.status || '';
            const statusLower = statusText.toLowerCase();
            const statusClass = statusLower.includes('arrived') ? 'status-arrived'
                : statusLower.includes('en route') ? 'status-enroute'
                : statusLower.includes('scheduled') ? 'status-scheduled'
                : '';
            const status = escapeHtml(statusText);
            const statusTime = f.statusTime ? formatTime(f.statusTime) : '';
            const isOverhead = overheadIds && overheadIds.has(f.faFlightId);
            const classes = [...(extraClasses || [])];
            classes.push('flight-row');
            if (isNextUp) classes.push('next-up');
            if (isOverhead) classes.push('overhead');
            if (statusLower.includes('arrived')) classes.push('arrived');
            const cls = ` class="${classes.join(' ')}"`;
            const onclick = f.faFlightId ? ` onclick="toggleFlightDetail('${escapeHtml(f.faFlightId)}')"` : '';
            let row = `<tr${cls}${onclick}>
                <td>${icon}</td>
                <td><span class="${timeSourceClass(f.timeSource)}" title="${timeSourceLabel(f.timeSource)}">${time}</span></td>
                <td>${identCell}</td>
                <td>${airportCell}</td>
                <td>${aircraft}</td>
                <td class="${statusClass}"><span class="status-cell">${status}${statusTime ? `<span class="status-time ${timeSourceClass(f.statusTimeSource)}" title="${timeSourceLabel(f.statusTimeSource)}">(${statusTime})</span>` : ''}</span></td>
            </tr>`;

            if (f.faFlightId && expandedFlights.has(f.faFlightId)) {
                row += renderFlightDetail(f);
            }

            return row;
        }

        function renderFlights(flights, tbody, overheadIds) {
            if (!flights || flights.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-flights">No flights</td></tr>';
                return;
            }

            // Separate arrived, en route departures, and active flights
            const arrivedFlights = [];
            const enrouteFlights = [];
            const activeFlights = [];
            for (const f of flights) {
                const statusLower = (f.status || '').toLowerCase();
                if (statusLower.includes('arrived')) {
                    arrivedFlights.push(f);
                } else if (f.direction === 'dep' && statusLower.includes('en route')) {
                    enrouteFlights.push(f);
                } else {
                    activeFlights.push(f);
                }
            }

            // Sort active flights by time
            activeFlights.sort((a, b) => {
                if (!a.time) return 1;
                if (!b.time) return -1;
                return new Date(a.time) - new Date(b.time);
            });

            // Sort arrived flights by time
            arrivedFlights.sort((a, b) => {
                if (!a.time) return 1;
                if (!b.time) return -1;
                return new Date(a.time) - new Date(b.time);
            });

            // Sort en route flights by time
            enrouteFlights.sort((a, b) => {
                if (!a.time) return 1;
                if (!b.time) return -1;
                return new Date(a.time) - new Date(b.time);
            });

            // Find the next-up flight among active flights
            const now = Date.now();
            let nextIdx = -1;
            for (let i = 0; i < activeFlights.length; i++) {
                if (activeFlights[i].time && new Date(activeFlights[i].time) >= now) {
                    nextIdx = i;
                    break;
                }
            }

            let html = '';

            // Render arrived divider + rows at top
            if (arrivedFlights.length > 0) {
                const arrow = arrivedExpanded ? '▼' : '▶';
                html += `<tr class="arrived-divider" onclick="toggleArrived()">
                    <td colspan="6">${arrow} Arrived (${arrivedFlights.length})</td>
                </tr>`;
                const hiddenClass = arrivedExpanded ? '' : 'arrived-hidden';
                for (const f of arrivedFlights) {
                    html += renderFlightRow(f, false, overheadIds, hiddenClass ? [hiddenClass] : []);
                }
            }

            // Render en route divider + rows
            if (enrouteFlights.length > 0) {
                const arrow = enrouteExpanded ? '▼' : '▶';
                html += `<tr class="arrived-divider" onclick="toggleEnroute()">
                    <td colspan="6">${arrow} En Route (${enrouteFlights.length})</td>
                </tr>`;
                const hiddenClass = enrouteExpanded ? '' : 'arrived-hidden';
                for (const f of enrouteFlights) {
                    html += renderFlightRow(f, false, overheadIds, hiddenClass ? [hiddenClass] : []);
                }
            }

            // Render active flights
            for (let i = 0; i < activeFlights.length; i++) {
                html += renderFlightRow(activeFlights[i], i === nextIdx, overheadIds);
            }

            if (html === '') {
                html = '<tr><td colspan="6" class="no-flights">No flights</td></tr>';
            }

            tbody.innerHTML = html;
        }

        function toggleArrived() {
            arrivedExpanded = !arrivedExpanded;
            const tbody = document.getElementById('flights-body');
            if (lastFlights.length) renderFlights(lastFlights, tbody, lastOverheadIds);
        }

        function toggleEnroute() {
            enrouteExpanded = !enrouteExpanded;
            const tbody = document.getElementById('flights-body');
            if (lastFlights.length) renderFlights(lastFlights, tbody, lastOverheadIds);
        }

        function renderFlightDetail(f) {
            const originCode = (f.origin && f.origin.code) || '';
            const originName = (f.origin && f.origin.name) || '';
            const destCode = (f.destination && f.destination.code) || '';
            const destName = (f.destination && f.destination.name) || '';

            function airportDisplay(code, name) {
                if (!code) return '—';
                const svURL = `https://skyvector.com/airport/${escapeHtml(code)}`;
                const label = name ? `${escapeHtml(code)} — ${escapeHtml(name)}` : escapeHtml(code);
                return `<a href="${svURL}" target="_blank">${label}</a>`;
            }

            const timeFields = [
                ['Sched Off', f.scheduledOff],
                ['Est Off', f.estimatedOff],
                ['Actual Off', f.actualOff],
                ['Sched On', f.scheduledOn],
                ['Est On', f.estimatedOn],
                ['Actual On', f.actualOn],
            ];

            const rows = [
                ['Origin', airportDisplay(originCode, originName)],
                ['Destination', airportDisplay(destCode, destName)],
                ['Status', escapeHtml(f.status || '—')],
                ['Aircraft', escapeHtml(f.aircraftType || '—')],
                ['Registration', escapeHtml(f.registration || '—')],
                ...timeFields.map(([label, iso]) => [label, iso ? escapeHtml(formatTime(iso)) : '—']),
            ];

            const infoHtml = rows.map(([label, value]) =>
                `<div class="info-label">${label}</div><div class="info-value">${value}</div>`
            ).join('');

            const mapId = `map-${f.faFlightId}`;
            let mapHtml;
            if (mapCache.has(f.faFlightId)) {
                const cached = mapCache.get(f.faFlightId);
                mapHtml = cached
                    ? `<img src="data:image/png;base64,${cached}" alt="Flight map">`
                    : `<div class="map-error">No map available</div>`;
            } else {
                mapHtml = `<div class="map-loading">Loading map&hellip;</div>`;
            }

            return `<tr class="flight-detail">
                <td colspan="6">
                    <div class="detail-content">
                        <div class="info-grid">${infoHtml}</div>
                        <div class="map-container" id="${mapId}">${mapHtml}</div>
                    </div>
                </td>
            </tr>`;
        }

        function toggleFlightDetail(faFlightId) {
            if (expandedFlights.has(faFlightId)) {
                expandedFlights.delete(faFlightId);
            } else {
                expandedFlights.add(faFlightId);
            }
            const tbody = document.getElementById('flights-body');
            if (lastFlights.length) renderFlights(lastFlights, tbody, lastOverheadIds);

            // Load map on demand if newly expanded and not cached
            if (expandedFlights.has(faFlightId) && !mapCache.has(faFlightId)) {
                fetch(`/flight/map?id=${encodeURIComponent(faFlightId)}`)
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return res.json();
                    })
                    .then(data => {
                        const mapEl = document.getElementById(`map-${faFlightId}`);
                        if (data.map) {
                            const b64 = data.map.replace(/\n/g, '');
                            mapCache.set(faFlightId, b64);
                            if (mapEl) mapEl.innerHTML = `<img src="data:image/png;base64,${b64}" alt="Flight map">`;
                        } else {
                            mapCache.set(faFlightId, null);
                            if (mapEl) mapEl.innerHTML = '<div class="map-error">No map available</div>';
                        }
                    })
                    .catch(err => {
                        console.error('Map fetch error:', err);
                        const mapEl = document.getElementById(`map-${faFlightId}`);
                        if (mapEl) mapEl.innerHTML = '<div class="map-error">Could not load map</div>';
                    });
            }
        }

        let lastFlights = [];
        let lastOverheadIds = new Set();

        async function refresh() {
            const tbody = document.getElementById('flights-body');

            try {
                const res = await fetch('/flights');
                if (!res.ok) throw new Error('Failed to fetch flights');
                const data = await res.json();

                const deps = (data.departures || []).map(f => ({ ...f, direction: 'dep' }));
                const arrs = (data.arrivals || []).map(f => ({ ...f, direction: 'arr' }));
                lastFlights = deps.concat(arrs);
                renderFlights(lastFlights, tbody, lastOverheadIds);
            } catch (err) {
                console.error('Refresh error:', err);
                tbody.innerHTML = '<tr><td colspan="6" class="error-msg">Error loading data</td></tr>';
            }

            document.getElementById('last-updated').textContent = 'Last updated: ' + formatNow();

            // Fetch overhead in background, re-render when it arrives
            fetch('/overhead').then(r => r.ok ? r.json() : null).then(oh => {
                if (oh) {
                    lastOverheadIds = new Set(oh.flightIds || []);
                    const tbody = document.getElementById('flights-body');
                    if (lastFlights.length) renderFlights(lastFlights, tbody, lastOverheadIds);
                }
            }).catch(() => {});
        }


        function updateBoardHeader() {
            const d = new Date();
            const day = d.toLocaleDateString([], { weekday: 'long' });
            const mon = d.toLocaleDateString([], { month: 'short' });
            const date = d.getDate();
            const year = d.getFullYear();
            document.getElementById('board-header').textContent =
                `Flights for ${day} ${mon} ${date}, ${year}`;
        }

        updateBoardHeader();

        // Fetch config, set header, then start refreshing
        (async function init() {
            try {
                const cfgRes = await fetch('/config');
                const cfg = await cfgRes.json();
                const code = cfg.homeAirport || '????';
                const info = await lookupAirport(code);
                const name = info && info.name ? info.name : '';
                const title = name ? `${code} — ${name}` : code;
                document.getElementById('airport-title').textContent = title;
                document.title = title;
            } catch (err) {
                console.error('Config load error:', err);
                document.getElementById('airport-title').textContent = 'Flighty';
            }
            refresh();
            setInterval(refresh, 2 * 60 * 1000);
        })();
    </script>
</body>
</html>
